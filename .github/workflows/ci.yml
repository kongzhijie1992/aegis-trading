name: ci
"on":
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.3.4
      - run: poetry install --no-interaction
      - run: poetry run python scripts/quality.py
      - name: Install headless browser for dashboard checks
        run: poetry run playwright install --with-deps chromium
      - name: Verify dashboard interactions and responsive layout
        run: poetry run python scripts/check_dashboard_ui.py
      - name: Dependency vulnerability audit (failure blocks merge)
        run: poetry run pip-audit --skip-editable --format json --output audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-reports
          path: |
            coverage.json
            coverage.xml
            audit.json
            dist/dashboard-*.png
          retention-days: 14

  test-and-package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.3.4
      - run: poetry install --no-interaction
      - run: poetry run python scripts/run_tests.py
      - run: python build_libraries.py
      - name: Resolve platform-specific third-party wheels
        run: poetry run python scripts/download_wheels.py
      - name: Install only built wheels and test outside source tree
        run: python verify_wheels.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  required:
    if: always()
    needs: [quality, test-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every upstream gate to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          PACKAGES: ${{ needs.test-and-package.result }}
        run: test "$QUALITY" = success && test "$PACKAGES" = success
