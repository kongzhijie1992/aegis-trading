[project]
name = "trading-ibkr"
version = "0.2.0"
description = "Explicit paper and live IBKR socket adapters"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["trading-contracts==0.2.0", "ib_async==2.1.0"]

[tool.poetry]
packages = [{include = "trading_ibkr", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
