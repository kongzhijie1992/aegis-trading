[project]
name = "trading-strategy"
version = "0.2.0"
description = "Pure signal generation"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["trading-contracts==0.1.0"]

[project.scripts]
aegis-signals = "trading_strategy.cli:main"

[tool.poetry]
packages = [{include = "trading_strategy", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
