[project]
name = "trading-simulation"
version = "0.1.1"
description = "Offline fixture broker and controlled clock"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["trading-contracts==0.2.0", "trading-portfolio==0.1.1"]

[tool.poetry]
packages = [{include = "trading_simulation", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
