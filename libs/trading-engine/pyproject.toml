[project]
name = "trading-engine"
version = "0.2.0"
description = "Component orchestration"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["trading-contracts==0.2.0", "trading-execution==0.2.0", "trading-risk==0.2.0", "trading-portfolio==0.1.1", "trading-marketdata==0.1.1"]

[tool.poetry]
packages = [{include = "trading_engine", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
