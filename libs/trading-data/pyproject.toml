[project]
name = "trading-data"
version = "0.1.0"
description = "Local revision-aware fundamental and macro data ingestion"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["tzdata>=2025.2"]

[project.scripts]
aegis-data = "trading_data.cli:entrypoint"

[tool.poetry]
packages = [{include = "trading_data", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
