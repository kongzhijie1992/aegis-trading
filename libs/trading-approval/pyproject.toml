[project]
name = "trading-approval"
version = "0.1.0"
description = "Individual typed order approval"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["trading-contracts==0.1.0"]

[tool.poetry]
packages = [{include = "trading_approval", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
