[project]
name = "trading-risk"
version = "0.2.0"
description = "Mandatory trading risk gates"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["trading-contracts==0.2.0", "tzdata>=2025.2"]

[tool.poetry]
packages = [{include = "trading_risk", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
